version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: socraticai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SocraticAI
      - APP_ENVIRONMENT=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LLM_PROVIDER=demo
      - TENSORZERO_ENABLED=true
      - TENSORZERO_GATEWAY_URL=http://tensorzero:3000
      - OTEL_ENABLED=true
      - OTEL_OTLP_ENDPOINT=otel-collector:4317
      - METRICS_ENABLED=true
      - DATABASE_URL=sqlite:///./data/socraticai.db
      - VECTOR_PERSIST_DIRECTORY=./data/chroma
      - API_UPLOAD_DIR=./data/uploads
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      tensorzero:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: socraticai-frontend
    ports:
      - "8501:8501"
    environment:
      - FRONTEND_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tensorzero:
    image: tensorzero/gateway:latest
    container_name: socraticai-tensorzero
    ports:
      - "3000:3000"
    volumes:
      - ./configs/tensorzero/tensorzero.toml:/app/config/tensorzero.toml:ro
    environment:
      - TENSORZERO_CONFIG_FILE=/app/config/tensorzero.toml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: socraticai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: socraticai-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: socraticai-otel-collector
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    volumes:
      - ./configs/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
