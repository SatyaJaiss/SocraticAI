[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socraticai"
version = "1.0.0"
description = "SocraticAI — Personalized AI Tutoring Platform built with LangGraph, FastAPI, and Streamlit"
readme = "README.md"
authors = [{ name = "SocraticAI Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "langgraph", "fastapi", "rag", "tutoring", "streamlit", "socraticai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-google-genai>=2.0,<3.0",
    "langgraph>=0.2.60,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "PyYAML>=6.0,<7.0",
    "chromadb>=0.5.20,<2.0",
    "sentence-transformers>=3.0,<5.0",
    "tiktoken>=0.7,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "tenacity>=8.4,<10.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "plotly>=5.22,<7.0",
    "streamlit>=1.40,<2.0",
    "typesafe-sdk>=0.7.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["apps/backend", "."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::DeprecationWarning:langchain_core.*",
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::DeprecationWarning:asyncio.*",
    "ignore::DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "data",
    "logs",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends)
    "B904", # Within an except clause, raise exceptions with raise ... from err
    "PLW0603", # Using global statement to update singleton
]
