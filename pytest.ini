[pytest]
testpaths = apps/backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:langgraph.*
    ignore::DeprecationWarning:langchain_core.*
    ignore::DeprecationWarning:langsmith.*
    ignore::DeprecationWarning:asyncio.*
addopts = -q
pythonpath = apps/backend .
